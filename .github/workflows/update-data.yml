name: 보조금24 데이터 매일 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 새벽 6시 (한국시간, GitHub는 UTC 기준이라 21시)
  workflow_dispatch: {}      # Actions 탭에서 "Run workflow"로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 받기
        env:
          GOV24_KEY: ${{ secrets.GOV24_KEY || secrets.ODCLOUD_KEY }}
        run: python scripts/fetch_api.py
      - name: 복지로 데이터 받기 (실패해도 계속)
        continue-on-error: true
        env:
          BOKJIRO_KEY: ${{ secrets.BOKJIRO_KEY || secrets.GOV24_KEY || secrets.ODCLOUD_KEY }}
        run: python scripts/fetch_bokjiro.py
      - name: 복지로 지자체(대구·경북) 받기 (실패해도 계속)
        continue-on-error: true
        env:
          BOKJIRO_KEY: ${{ secrets.BOKJIRO_KEY || secrets.GOV24_KEY || secrets.ODCLOUD_KEY }}
        run: python scripts/fetch_local.py
      - name: 온통청년 청년정책 받기 (실패해도 계속)
        continue-on-error: true
        env:
          YOUTH_KEY: ${{ secrets.YOUTH_KEY }}
        run: python scripts/fetch_youth.py
      - name: 지원내용·선정기준 글에서 금액·소득·나이 뽑기 (실패해도 계속)
        continue-on-error: true
        env:
          BOKJIRO_KEY: ${{ secrets.BOKJIRO_KEY || secrets.GOV24_KEY || secrets.ODCLOUD_KEY }}
        run: python scripts/extract_details.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "subsidy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "보조금24 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

name: 보조금24 데이터 매일 갱신

on:
  schedule:
    - cron: "7 18 * * *"   # 매일 새벽 3시 7분 (한국시간)
  workflow_dispatch: {}      # Actions 탭에서 "Run workflow"로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 받기
        env:
          GOV24_KEY: ${{ secrets.GOV24_KEY || secrets.ODCLOUD_KEY }}
        run: python scripts/fetch_api.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "subsidy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/benefits.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "보조금24 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

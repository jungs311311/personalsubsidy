name: 구글 시트 기준표 반영

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (시트를 고치면 1시간 안에 사이트에 반영)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시트 읽기
        run: python scripts/fetch_sheet.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "subsidy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/manual.json 2>/dev/null || true
          # 시각(updated)만 바뀐 경우는 저장하지 않음
          if git diff --cached --quiet || [ "$(git diff --cached -U0 | grep -E '^[+-][^+-]' | grep -vc '"updated"')" = "0" ]; then
            git reset -q; echo "변경 없음"
          else
            git commit -m "시트 기준표 반영 $(TZ=Asia/Seoul date '+%F %H:%M')"
            git pull --rebase -q && git push
          fi
